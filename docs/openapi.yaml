          type: integer
        agility:
          type: integer
        control:
          type: integer
        speed:
          type: integer
        strength:
          type: integer
        comportamiento:
          $ref: '#/components/schemas/Comportamiento' # tal vez esto no va, ahora mismo sería composición de properties.
    
    # --- Comportamientos ---
    CrearComportamientoInput:
      type: object
      required: [nombre, codigo]
      properties:
        nombre:
          type: string
        codigo:
          type: string
          description: |
              Código del comportamiento en Python. Se debe verificar. Primitivas válidas: 
              Sensores: my-pos(), ball-pos(), has-ball(), team-pos(), enemy-pos()
              Acciones: move(x,y), pass(jugador_id), shoot(), tackle(), carryball(x,y)

    Comportamiento:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        codigo:
          type: string
    
    # --- Ligas ---
    CrearLigaInput:
      type: object
      required: [nombre, min_clubs, max_clubes, duracion_partido_minutos]
      properties:
        nombre_club:
          type: string
        password:
          type: [string, "null"]
        min_clubes:
          type: integer
          minimum: 3
        max_clubes:
          type: integer
        duracion_partido_minutos:
          type: integer
    
    Liga:
      type: object
      properties: 
        id:
          type: string
          format: uuid
        nombre:
          type: string
        es_privada:
          type: boolean
          description: derivado de si la liga tiene password
        min_clubes:
          type: integer
        max_clubes:
          type: integer
        estado:
          type: string
          enum: [no_iniciada, iniciada, finalizada]
    
    ConvocadoInput:
      type: object
      required: [jugador_id, es_titular_default]
      properties: 
        jugador_id:
          type: string
          format: uuid
        es_titular_default:
          type: boolean

    CrearInscripcionInput:
      type: object
      required: [jugadores]
      properties:
        password:
          type: string
        jugadores:
          type: array
          minItems: 6
          maxItems: 6
          description: Exactamente 3 con es_titular_default en true y 3 en false.
          items:
            $ref: '#components/schemas/ConvocadoInput'

