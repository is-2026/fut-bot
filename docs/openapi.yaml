openapi: 3.2.0
info:
  title: FutBot API
  version: 1.0.0
  description: API REST para la plataforma FutBot. gestion de usuarios, jugadores, partidos, ligas, gestión y  validación de comportamientos en Python, datos del ranking
servers:
  - url: https://localhost:5000
    description: placeholder, cambiar luego

tags:
  - name: Autenticación
  - name: Usuario
  - name: Club
  - name: Jugadores
  - name: Comportamientos
  - name: Ligas
  - name: Amistosos
  - name: Partido
  - name: Ranking

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------------------
  # Autenticación y Usuario
  # ---------------------------------------------------------------------------
  /auth/registro:
    post:
      tags: [Autenticación]
      summary: Registrar Usuario
      description: >
        Crea la cuenta de usuario. El club se crea en un paso separado (POST /club) inmediatamente después, dentro del mismo flujo de onboarding del cliente.
      operationId: registrar_usuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioRegistroInput'
      responses:
        '201':
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: El email ya está registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesion
      operationId: iniciar_sesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginInput'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Email o contraseña incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
  /auth/logout:
    post:
      tags: [Autenticación]
      summary: Cerrar sesión
      operationId: cerrar_sesion
      responses:
        '200':
          description: Sesión cerrada

  /usuarios/me/password:
    patch:
      tags: [Usuario]
      summary: Modificar contraseña
      operationId: cambiar_password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarPasswordInput'
      responses:
        '200':
          description: Contraseña actualizada
        '400':
          description: >
            La contraseña actual es incorrecta, o la nueva coincide con la
            actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # -----------------------------------------------------------------------------
  # Club
  # -----------------------------------------------------------------------------
  /club:
    post:
      tags: [Club]
      summary: Crear club (segundo paso del registro)
      operationId: crear_club
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CrearClubInput'
      responses:
        '201':
          description: Club creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
        '409':
          description: El usuario ya tiene un club creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Club]
      summary: Obtener mi club
      operationId: obtener_mi_club 
      description: Identifica al club mediante el token de sesión.
      responses:
        '200':
          description: Datos del club propio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
    patch:
      tags: [Club]
      summary: Modificar avatar del club
      operationId: modificar_avatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClubAvatarUpdateRequest'
      responses:
        '200':
          description: Avatar actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'

  /clubes/{club_id}:
    get:
      tags: [Club]
      summary: Ver club de un usuario
      operationId: obtener_club
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Datos públicos del club
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
        '404':
          $ref: '#/components/responses/NotFound' 
  
  # ---------------------------------------------------------------------------
  # Jugadores
  # ---------------------------------------------------------------------------
  /club/jugadores:
    post:
      tags: [Jugadores]
      summary: Crear jugador
      description: Crea un nuevo jugador en el club del usuario. Notar que la suma de sus PACSS debe ser exactamente 300.
      operationId: crear_jugador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearJugadorInput'
      responses:
        '201':
          description: Jugador creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jugador'
        '400':
          description: La suma de los PACSS no es 300, o alguno está fuera de rango (20-100)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Jugadores]
      summary: Listar jugadores del club
      operationId: listar_mis_jugadores
      responses:
        '200':
          description: Plantilla completa del club.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Jugador'

  /club/jugadores/{jugador_id}:
    parameters:
      - name: jugador_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Jugadores]
      summary: Obtener jugador
      operationId: obtener_mi_jugador
      responses:
        '200':
          description: Datos del jugador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jugador'
        '404':
          description: Jugador no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Jugadores]
      summary: Eliminar jugador
      operationId: eliminar_jugador
      responses:
        '200':
          description: Jugador eliminado
        '404':
          description: Jugador no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El jugador está participando en una liga activa o un partido en curso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # no estoy seguro que este endpoint lo necesitemos, lo dejo y lo charlamos
  /clubes/{club_id}/jugadores:
    get:
      summary: Listar jugadores del club
      description: muestra los jugadores creados del club.
      operationId: listar_jugadores
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Listado de jugadores del club
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Jugador'
    
  # lo mismo este, pero puede servir para cuando tenes que ver los datos del jugador de otro en un partido (eliminar jugador lo saco, no tiene sentido si usamos el de arriba)
  /clubes/{club_id}/jugadores/{jugador_id}:
    get:
      summary: Obtener detalle de un jugador
      description: obtiene un jugador segun su id.
      operationId: obtener_jugador
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: integer
        - name: jugador_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jugador'

# ----------------------------------------------------------------------------- 
# Comportamiento
# -----------------------------------------------------------------------------
  /club/comportamientos:
    get:
      tags: [Comportamientos]
      summary: Listar comportamientos guardados
      operationId: listar_comportamientos
      responses:
        '200':
          description: Comportamientos disponibles (OK)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comportamiento'
    post:
      tags: [Comportamientos]
      summary: Crear nuevo Comportamiento
      operationId: crear_comportamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearComportamientoInput'
      responses:
        '201':
          description: Comportamiento creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comportamiento'
        '400':
          description: El código contiene errores de sintaxis o instrucciones prohibidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /club/comportamientos/{comportamiento_id}:
    parameters:
      - name: comportamiento_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Comportamientos]
      summary: Obtener comportamiento por id
      operationId: obtener_comportamiento
      responses:
        '200':
          description: Detalle del comportamiento (OK)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comportamiento'
        '404':
          description: Comportamiento no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Comportamientos]
      summary: Editar comportamiento
      operationId: editar_comportamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearComportamientoInput'
      responses:
        '200':
          description: Comportamiento editado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comportamiento'
        '404':
          description: Comportamiento no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El comportamiento está en uso por un jugador en un partido en curso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Comportamientos]
      summary: Eliminar comportamiento
      operationId: eliminar_comportamiento
      responses:
        '200':
          description: Comportamiento eliminado
        '404':
          description: Comportamiento no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El comportamiento está en uso por un jugador en un partido en curso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

# -----------------------------------------------------------------------------
# Ligas
# -----------------------------------------------------------------------------
  /ligas:
    post:
      tags: [Ligas]
      summary: Crear liga
      description: Notar que la cantidad de clubes tiene un mínimo duro de 3. Si se envía password, la liga se considera privada.
      operationId: crear_liga
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearLigaInput'
      responses:
        '201':
          description: Liga creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liga'
        '400':
          description: min_clubes es menor a 3, o max_clubes excede el límite del sistema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Ligas]
      summary: Listar ligas
      description: Devuelve tanto ligas públicas como privadas. Hay dos parámetros de query:\ estado y nombre.
      operationId: listar_ligas
      parameters:
        - name: estado
          in: query
          schema:
            type: string
            enum: [no_iniciada, iniciada, finalizada]
        - name: nombre
          in: query
          description: Filtro de búsqueda por nombre
          schema:
            type: string
      responses:
        '200':
          description: Ligas disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Liga'

  /ligas/{liga_id}:
    parameters:
      - name: liga_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Ligas]
      summary: Obtener detalle de una liga
      operationId: obtener_liga
      responses:
        '200':
          description: Datos de la liga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liga'
        '404':
          description: Liga no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Ligas]
      summary: Cancelar liga
      description: Solo el creador puede cancelarla, y solo si no está iniciada.
      operationId: cancelar_liga
      responses:
        '200':
          description: Liga cancelada
        '403':
          description: El usuario no es el creador de la liga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: La liga ya se encuentra iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /ligas/{liga_id}/inscripciones:
    parameters:
      - name: liga_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Ligas]
      summary: Unirse a una liga
      description: Reserva un cupo para la liga. Se definen 6 jugadores convocados para toda la liga (3 marcados como titulares por defecto, 3 como suplentes). Los titulares enviados se usan como fallback si el club no define la alineación antes de alguno de sus partidos.
      operationId: unirse_liga
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearInscripcionInput'
      responses:
        '200':
          description: Inscripción registrada
        '400':
          description: La contraseña de la liga privada es incorrecta, o no se enviaron exactamente 3 titulares y 3 suplentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El club ya está inscripto en esta liga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Ligas]
      summary: Abandonar liga
      operationId: abandonar_liga
      responses:
        '200':
          description: Inscripción eliminada
        '409':
          description: La liga ya se encuentra iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /ligas/{liga_id}/inicio:
    parameters:
      - name: liga_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Ligas]
      summary: Iniciar liga
      description: Solo el creador puede iniciarla. Cambia el estado a "iniciada" y genera el fixture.
      operationId: iniciar_liga
      responses:
        '200':
          description: Liga iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liga'
        '403':
          description: El usuario no es el creador de la liga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /ligas/{liga_id}/fixture:
    parameters:
      - name: liga_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Ligas]
      summary: Consultar fixture
      description: Requiere que la liga esté iniciada.
      operationId: obtener_fixture
      responses:
        '200':
          description: Fixture de la liga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixtureResponse'
        '409':
          description: La liga aún no fue iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /ligas/{liga_id}/tabla:
    parameters:
      - name: liga_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Ligas]
      summary: Tabla de posiciones
      operationId: obtener_tabla
      responses:
        '200':
          description: Tabla de posiciones de la liga
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TablaPosicionesItem'
        '409':
          description: La liga aún no fue iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /ligas/{liga_id}/partidos:
    parameters:
      - name: liga_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Ligas]
      summary: Listar partidos de una liga
      parameters:
        - name: estado
          in: query
          schema:
            type: string
            enum: [programado, en_curso, finalizado]
      description: Revisar, solapamiento con fixture!!
      operationId: listar_partidos_liga
      responses:
        '200':
          description: Partidos de la liga
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartidoResumen'

# -----------------------------------------------------------------------------
# Amistosos
# -----------------------------------------------------------------------------
  /amistosos/desafios:
    post:
      tags: [Amistosos]
      summary: Enviar desafío amistoso
      description: Incluye el pool de 6 convocados del club retador.
      operationId: enviar_desafio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearDesafioInput'
      responses:
        '201':
          description: Desafío creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Desafio'
    get:
      tags: [Amistosos]
      summary: Listar desafíos propios
      operationId: listar_desafios
      parameters:
        - name: direccion
          in: query
          description: Filtra por desafíos enviados o recibidos por el club
          schema:
            type: string
            enum: [enviados, recibidos]
      responses:
        '200':
          description: Desafíos del club
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Desafio'

  /amistosos/desafios/{desafio_id}:
    parameters:
    - name: desafio_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    delete:
      tags: [Amistosos]
      summary: Cancelar desafío enviado
      description: Solo el club retador puede cancelarlo, y solo si sigue pendiente.
      operationId: cancelar_desafio
      responses:
        '200':
          description: Desafío cancelado
        '409':
          description: El desafío ya fue respondido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [Amistosos]
      summary: Responder desafío amistoso
      description: Si se acepta, se debe incluir el pool de 6 convocados del club desafiado, y se crea el partido.
      operationId: responder_desafio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesafioRespuestaInput'
      responses:
        '200':
          description: Desafío respondido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Desafio'
        '409':
          description: El desafío ya no está disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /amistosos/busqueda:
    post:
      tags: [Amistosos]
      summary: Iniciar búsqueda de rival (matchmaking público)
      description: Devuelve el ticket nomás. La notificación de emparejamiento exitoso se recibe de forma asíncrona vía WebSocket en el canal `/ws/amistosos/busqueda` (ver especificación AsyncAPI, mensaje 'PartidoEncontrado').
      operationId: iniciar_matchmaking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearBusquedaInput'
      responses:
        '202':
          description: Búsqueda iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Busqueda'
    delete:
      tags: [Amistosos]
      summary: Cancelar búsqueda de rival
      operationId: cancelar_matchmaking
      responses:
        '200':
          description: Búsqueda cancelada
  
# -----------------------------------------------------------------------------
# Ranking
# -----------------------------------------------------------------------------
  /ranking:
    get:
      tags: [Ranking]
      summary: Ver ranking global
      description: Calculado a partir de los partidos jugados en instancias públicas (ligas públicas y amistosos).
      operationId: obtener_ranking
      responses:
        '200':
          description: Ranking mundial
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RankingItem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        codigo:
          type: string
        mensaje:
          type: string
      required: [codigo, mensaje]

    # -- Autenticación / Usuario ---
    UsuarioRegistroInput:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthLoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    
    AuthResponse:
      type: object
      properties:
        token:
          type: string
    
    CambiarPasswordInput:
      type: object
      required: [password_actual, nueva_password]
      properties:
        password_actual:
          type: string
          format: password
        nueva_password:
          type: string
          format: password
    
    Usuario:
      type: object
      required: [id, username, email, password]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        password:
          type: string
    
    # --- Club ---
    CrearClubInput:
      type: object
      required: [nombre_club, avatar]
      properties:
        nombre_club:
          type: string
        avatar:
          type: string
          format: binary

    CambiarAvatarClubInput:
      type: object
      required: [avatar]
      properties:
        avatar:
          type: string
          format: binary
    
    Club:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre_club:
          type: string
        avatar_url:
          type: string
          format: uri
        usuario_id:
          type: string
          format: uuid
        fecha_creacion:
          type: string
          format: date-time

    # --- Jugadores ---
    CrearJugadorInput:
      type: object
      required: [nombre, power, agility, control, speed, strength]
      description: La suma de los 5 atributos debe ser exactamente 300.
      properties:
        nombre:
          type: string
        numero:
          type: integer
          minimun: 1
          maximum: 99
        power:
          type: integer
