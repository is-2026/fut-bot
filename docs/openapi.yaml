openapi: 3.2.0
info:
  title: FutBot API
  version: 1.0.0
  description: API REST para la plataforma FutBot. gestion de usuarios, jugadores, partidos, ligas, gestión y  validación de comportamientos en Python, datos del ranking
servers:
  - url: https://localhost:5000
    description: placeholder, cambiar luego

tags:
  - name: Autenticación
  - name: Usuario
  - name: Club
  - name: Jugadores
  - name: Comportamientos
  - name: Ligas
  - name: Amistosos
  - name: Partido
  - name: Ranking

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------------------
  # Autenticación y Usuario
  # ---------------------------------------------------------------------------
  /auth/registro:
    post:
      tags: [Autenticación]
      summary: Registrar Usuario
      description: >
        Crea la cuenta de usuario. El club se crea en un paso separado (POST /club) inmediatamente después, dentro del mismo flujo de onboarding del cliente.
      operationId: registrar_usuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioRegistroInput'
      responses:
        '201':
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: El email ya está registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesion
      operationId: iniciar_sesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginInput'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Email o contraseña incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
  /auth/logout:
    post:
      tags: [Autenticación]
      summary: Cerrar sesión
      operationId: cerrar_sesion
      responses:
        '200':
          description: Sesión cerrada

  /usuarios/me/password:
    patch:
      tags: [Usuario]
      summary: Modificar contraseña
      operationId: cambiar_password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarPasswordInput'
      responses:
        '200':
          description: Contraseña actualizada
        '400':
          description: >
            La contraseña actual es incorrecta, o la nueva coincide con la
            actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # -----------------------------------------------------------------------------
  # Club
  # -----------------------------------------------------------------------------
  /club:
    post:
      tags: [Club]
      summary: Crear club (segundo paso del registro)
      operationId: crear_club
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CrearClubInput'
      responses:
        '201':
          description: Club creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
        '409':
          description: El usuario ya tiene un club creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Club]
      summary: Obtener mi club
      operationId: obtener_mi_club 
      description: Identifica al club mediante el token de sesión.
      responses:
        '200':
          description: Datos del club propio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
    patch:
      tags: [Club]
      summary: Modificar avatar del club
      operationId: modificar_avatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClubAvatarUpdateRequest'
      responses:
        '200':
          description: Avatar actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'

  /clubes/{club_id}:
    get:
      tags: [Club]
      summary: Ver club de un usuario
      operationId: obtener_club
      parameters:
        - $ref: '#/components/parameters/ClubIdPath'
      responses:
        '200':
          description: Datos públicos del club
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
        '404':
          $ref: '#/components/responses/NotFound' 
  
  # ---------------------------------------------------------------------------
  # Jugadores
  # ---------------------------------------------------------------------------
  /club/jugadores:
    post:
      tags: [Jugadores]
      summary: Crear jugador
      description: Crea un nuevo jugador en el club del usuario. Notar que la suma de sus PACSS debe ser exactamente 300.
      operationId: crear_jugador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearJugadorInput'
      responses:
        '201':
          description: Jugador creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jugador'
        '400':
          description: La suma de los PACSS no es 300, o alguno está fuera de rango (20-100)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Jugadores]
      summary: Listar jugadores del club
      operationId: listar_mis_jugadores
      responses:
        '200':
          description: Plantilla completa del club.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Jugador'

  /club/jugadores/{jugador_id}:
    parameters:
      - name: jugador_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Jugadores]
      summary: Obtener jugador
      operationId: obtener_mi_jugador
      responses:
        '200':
          description: Datos del jugador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jugador'
        '404':
          description: Jugador no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Jugadores]
      summary: Eliminar jugador
      operationId: eliminar_jugador
      responses:
        '200':
          description: Jugador eliminado
        '404':
          description: Jugador no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El jugador está participando en una liga activa o un partido en curso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # no estoy seguro que este endpoint lo necesitemos, lo dejo y lo charlamos
  /clubes/{club_id}/jugadores:
    get:
      summary: Listar jugadores del club
      description: muestra los jugadores creados del club.
      operationId: listar_jugadores
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Listado de jugadores del club
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Jugador'
    
  # lo mismo este, pero puede servir para cuando tenes que ver los datos del jugador de otro en un partido (eliminar jugador lo saco, no tiene sentido si usamos el de arriba)
  /clubes/{club_id}/jugadores/{jugador_id}:
    get:
      summary: Obtener detalle de un jugador
      description: obtiene un jugador segun su id.
      operationId: obtener_jugador
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: integer
        - name: jugador_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jugador'

# ----------------------------------------------------------------------------- 
# Comportamiento
# -----------------------------------------------------------------------------
/clubes/{club_id}/comportamientos:
    get:
      summary: Listar comportamientos guardados
      operationId: listar_comportamientos
      security:
        - TokenAuth: []
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comportamiento'
    post:
      summary: Crear nuevo Comportamiento
      operationId: crear_comportamiento
      security:
        - TokenAuth: []
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComportamientoInput'
      responses:
        '201':
          description: Comportamiento creado

  # indiv
  /clubes/{club_id}/comportamientos/{comportamiento_id}:
    get:
      summary: Obtener comportamiento por id
      operationId: obtener_comportamiento
      security:
        - TokenAuth: []
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: integer
        - name: comportamiento_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comportamiento'
    put:
      summary: Editar comportamiento
      operationId: editar_comportamiento
      security:
        - TokenAuth: []
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: integer
        - name: comportamiento_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                codigo:
                  type: string
      responses:
        '200':
          description: Comportamiento editado
    delete:
      summary: Eliminar comportamiento
      operationId: eliminar_comportamiento
      security:
        - TokenAuth: []
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: integer
        - name: comportamiento_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Comportmiento eliminado


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    
  #parameters:
    # por definir

  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        codigo:
          type: string
        mensaje:
          type: string
      required: [codigo, mensaje]

    # -- Autenticación / Usuario ---
    UsuarioRegistroInput:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthLoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    
    AuthResponse:
      type: object
      properties:
        token:
          type: string
    
    CambiarPasswordInput:
      type: object
      required: [password_actual, nueva_password]
      properties:
        password_actual:
          type: string
          format: password
        nueva_password:
          type: string
          format: password
    
    # --- Club ---
    CrearClubInput:
      type: object
      required: [nombre_club, avatar]
      properties:
        nombre_club:
          type: string
        avatar:
          type: string
          format: binary

    CambiarAvatarClubInput:
      type: object
      required: [avatar]
      properties:
        avatar:
          type: string
          format: binary
    
    Club:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre_club:
          type: string
        avatar_url:
          type: string
          format: uri
        usuario_id:
          type: string
          format: uuid
        fecha_creacion:
          type: string
          format: date-time

    # --- Jugadores ---
    CrearJugadorInput:
      type: object
      required: [nombre, power, agility, control, speed, strength]
      description: La suma de los 5 atributos debe ser exactamente 300.
      properties:
        nombre:
          type: string
        power:
          type: integer
          minimun: 20
          maximum: 100
        agility:
          type: integer
          minimun: 20
          maximum: 100
        control:
          type: integer
          minimun: 20
          maximum: 100
        speed:
          type: integer
          minimun: 20
          maximum: 100
        strength:
          type: integer
          minimun: 20
          maximum: 100

    Jugador:
      type: object
      properties:
        id:
          type: integer
          format: uuid
        nombre:
          type: string
        power:
          type: integer
        agility:
          type: integer
        control:
          type: integer
        speed:
          type: integer
        strength:
          type: integer
        comportamiento:
          $ref: '#/components/schemas/Comportamiento'

    ComportamientoInput:
      type: object
      required: [nombre, codigo]
      properties:
        nombre:
          type: string
        codigo:
          type: string

    # entidades
    
    Usuario:
      type: object
      required: [id, username, email, password]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        password:
          type: string

    Comportamiento:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        codigo:
          type: string
