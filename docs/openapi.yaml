openapi: 3.2.0
info:
  title: FutBot API
  version: 1.0.0
  description: API REST para la plataforma FutBot. gestion de usuarios, jugadores, partidos, ligas, gestión y  validación de comportamientos en Python, datos del ranking
servers:
  - url: https://localhost:5000
    description: placeholder, cambiar luego

tags:
  - name: Autenticación
  - name: Usuario
  - name: Club
  - name: Jugadores
  - name: Comportamientos
  - name: Ligas
  - name: Amistosos
  - name: Partido
  - name: Ranking

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------------------
  # Autenticación y Usuario
  # ---------------------------------------------------------------------------
  /auth/registro:
    post:
      tags: [Autenticación]
      summary: Registrar Usuario
      description: >
        Crea la cuenta de usuario. El club se crea en un paso separado (POST /club) inmediatamente después, dentro del mismo flujo de onboarding del cliente.
      operationId: registrar_usuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioRegistroInput'
      responses:
        '201':
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: El email ya está registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesion
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginInput'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Email o contraseña incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
  /auth/logout:
    post:
      tags: [Autenticación]
      summary: Cerrar sesión
      responses:
        '200':
          description: Sesión cerrada

  /usuarios/me/password:
    patch:
      tags: [Usuario]
      summary: Modificar contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarPasswordInput'
      responses:
        '200':
          description: Contraseña actualizada
        '400':
          description: >
            La contraseña actual es incorrecta, o la nueva coincide con la
            actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /usuarios/{username}/password:
    put:
      summary: Cambiar contraseña
      operationId: cambiar_password
      security:
        - TokenAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nueva_password:
                  type: string
      responses:
        '200':
          description: Contraseña actualizada



  #jugador/es

  /clubes/{club_id}/jugadores:
    get:
      summary: Listar jugadores del club
      description: muestra los jugadores creados del club.
      operationId: listar_jugadores
      security:
        - TokenAuth: []
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Listado de jugadores del club
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Jugador'
    post:
      summary: Crear Jugador
      description: crea un nuevo jugador en el club.
      operationId: crear_jugador
      security:
        - TokenAuth: []
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JugadorInput'
      responses:
        '201':
          description: Jugador creado exitosamente

  /clubes/{club_id}/jugadores/{jugador_id}:
    get:
      summary: Obtener detalle de un jugador
      description: obtiene un jugador segun su id.
      operationId: obtener_jugador
      security:
        - TokenAuth: []
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: integer
        - name: jugador_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jugador'
    delete:
      summary: Eliminar Jugador (CU 9)
      operationId: eliminar_jugador
      security:
        - TokenAuth: []
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: integer
        - name: jugador_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Jugador eliminado
  
  #comportamiento

/clubes/{club_id}/comportamientos:
    get:
      summary: Listar comportamientos guardados
      operationId: listar_comportamientos
      security:
        - TokenAuth: []
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comportamiento'
    post:
      summary: Crear nuevo Comportamiento
      operationId: crear_comportamiento
      security:
        - TokenAuth: []
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComportamientoInput'
      responses:
        '201':
          description: Comportamiento creado

  # indiv
  /clubes/{club_id}/comportamientos/{comportamiento_id}:
    get:
      summary: Obtener comportamiento por id
      operationId: obtener_comportamiento
      security:
        - TokenAuth: []
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: integer
        - name: comportamiento_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comportamiento'
    put:
      summary: Editar comportamiento
      operationId: editar_comportamiento
      security:
        - TokenAuth: []
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: integer
        - name: comportamiento_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                codigo:
                  type: string
      responses:
        '200':
          description: Comportamiento editado
    delete:
      summary: Eliminar comportamiento
      operationId: eliminar_comportamiento
      security:
        - TokenAuth: []
      parameters:
        - name: club_id
          in: path
          required: true
          schema:
            type: integer
        - name: comportamiento_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Comportmiento eliminado


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    
  #parameters:
    # por definir

  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        codigo:
          type: string
        mensaje:
          type: string
      required: [codigo, mensaje]

      # -- Autenticación / Usuario ---
    UsuarioRegistroInput:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthLoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    
    AuthResponse:
      type: object
      properties:
        token:
          type: string
    
    CambiarPasswordInput:
      type: object
      required: [password_actual, nueva_password]
      properties:
        password_actual:
          type: string
          format: password
        nueva_password:
          type: string
          format: password
    
    # --- Club ---


    JugadorInput:
      type: object
      required: [nombre, power, agility, control, speed, strength]
      properties:
        nombre:
          type: string
        power:
          type: integer
        agility:
          type: integer
        control:
          type: integer
        speed:
          type: integer
        strength:
          type: integer

    ComportamientoInput:
      type: object
      required: [nombre, codigo]
      properties:
        nombre:
          type: string
        codigo:
          type: string

    # entidades
    
    Usuario:
      type: object
      required: [id, username, email, password]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        password:
          type: string

    Jugador:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        power:
          type: integer
        agility:
          type: integer
        control:
          type: integer
        speed:
          type: integer
        strength:
          type: integer
        comportamiento:
          $ref: '#/components/schemas/Comportamiento'

    Comportamiento:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        codigo:
          type: string
